services:
  wordpress:
    image: wordpress:latest
    container_name: gyaru_web
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: nif_db
      WORDPRESS_DB_USER: nif_user
      WORDPRESS_DB_PASSWORD: nif0430
    volumes:
      - ./wordpress:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: gyaru_db
    environment:
      MYSQL_DATABASE: nif_db
      MYSQL_USER: nif_user
      MYSQL_PASSWORD: nif0430
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gyaru_web_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: wordpress
      PMA_PASSWORD: wordpress
    depends_on:
      - db

volumes:
  db_data:
